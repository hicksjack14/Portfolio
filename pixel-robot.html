function decodePixels() {
  const bin = atob(DATA_B64);
  const buf = new ArrayBuffer(bin.length);
  const u8  = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Int16Array(buf);
}

const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
let W = canvas.clientWidth  || window.innerWidth;
let H = canvas.clientHeight || window.innerHeight;

// Orthographic camera — guarantees full character is always framed correctly
// fH=160 gives character ±153 units a tight fit with small margin
function makeCamera() {
  const aspect = W / H;
  const fH = 162;
  const fW = fH * aspect;
  const cam = new THREE.OrthographicCamera(-fW, fW, fH, -fH, 0.1, 2000);
  cam.position.z = 300;
  return cam;
}
let camera = makeCamera();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.42));
const key = new THREE.DirectionalLight(0xffeedd, 1.3);
key.position.set(-4, 5, 8);
scene.add(key);
const fill = new THREE.DirectionalLight(0xaac4ff, 0.5);
fill.position.set(6, -2, 4);
scene.add(fill);
const back = new THREE.DirectionalLight(0xffd080, 0.28);
back.position.set(1, 2, -6);
scene.add(back);

// Build voxels — cubic so sides read as real depth when rotated
const raw    = decodePixels();
const COUNT  = raw.length / 3;
const colors = PALETTE_HEX.map(h => new THREE.Color(h));
function lum(c) { return c.r * 0.299 + c.g * 0.587 + c.b * 0.114; }

const geo = new THREE.BoxGeometry(0.86, 0.86, 0.86);
const mat = new THREE.MeshLambertMaterial({ vertexColors: false });
const mesh = new THREE.InstancedMesh(geo, mat, COUNT);
mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(COUNT * 3), 3);

const mtx = new THREE.Matrix4();
const col  = new THREE.Color();

for (let i = 0; i < COUNT; i++) {
  const ox = raw[i * 3];
  const oy = raw[i * 3 + 1];
  const ci = raw[i * 3 + 2];
  const c  = colors[ci];
  const l  = lum(c);
  const oz = (l - 0.35) * 2.8;
  mtx.makeTranslation(ox, -oy, oz);
  mesh.setMatrixAt(i, mtx);
  col.setRGB(c.r, c.g, c.b);
  mesh.setColorAt(i, col);
}
mesh.instanceMatrix.needsUpdate = true;
mesh.instanceColor.needsUpdate  = true;

const pivot = new THREE.Group();
pivot.add(mesh);
scene.add(pivot);

// Start at 25° — character still reads as wide, but clearly 3D when rotating
const START_Y = 0.44;
let targetRotX = 0.12, targetRotY = START_Y;
let currentRotX = 0.12, currentRotY = START_Y;

let isDragging = false, lastX = 0, lastY = 0;
let autoRotate = true, autoTimer = null, hintHidden = false;

function resumeAuto() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { autoRotate = true; }, 2800);
}

canvas.addEventListener('mousedown', e => {
  isDragging = true; autoRotate = false;
  lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('dragging');
  if (!hintHidden) { document.getElementById('hint').classList.add('hidden'); hintHidden = true; }
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  targetRotY += (e.clientX - lastX) * 0.009;
  targetRotX += (e.clientY - lastY) * 0.005;
  targetRotX  = Math.max(-0.8, Math.min(0.8, targetRotX));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  canvas.classList.remove('dragging');
  resumeAuto();
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); autoRotate = false;
  const t = e.touches[0]; lastX = t.clientX; lastY = t.clientY;
  if (!hintHidden) { document.getElementById('hint').classList.add('hidden'); hintHidden = true; }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  targetRotY += (t.clientX - lastX) * 0.009;
  targetRotX += (t.clientY - lastY) * 0.005;
  targetRotX  = Math.max(-0.8, Math.min(0.8, targetRotX));
  lastX = t.clientX; lastY = t.clientY;
}, { passive: false });
canvas.addEventListener('touchend', () => resumeAuto());

function onResize() {
  W = canvas.clientWidth; H = canvas.clientHeight;
  renderer.setSize(W, H, false);
  const aspect = W / H;
  const fH = 162, fW = fH * aspect;
  camera.left = -fW; camera.right = fW;
  camera.top = fH; camera.bottom = -fH;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

let t0 = null;
function animate(ts) {
  requestAnimationFrame(animate);
  if (t0 === null) t0 = ts;
  if (autoRotate) {
    targetRotY += 0.0028;
    targetRotX  = 0.12;
  }
  currentRotX += (targetRotX - currentRotX) * 0.072;
  currentRotY += (targetRotY - currentRotY) * 0.072;
  pivot.rotation.x = currentRotX;
  pivot.rotation.y = currentRotY;
  pivot.position.y = Math.sin((ts - t0) * 0.0007) * 1.8;
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
